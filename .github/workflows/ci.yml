name: NeckLink checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: necklink
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/necklink
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/necklink_test
      DISABLE_EXTERNAL_DELIVERY: 'true'
      APP_MODE: demo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: npm ci --prefix apps/api && npm ci --prefix apps/web
      - run: python -m venv apps/ml-service/.venv && apps/ml-service/.venv/bin/pip install -r apps/ml-service/requirements.lock.txt
      - run: npm --prefix apps/api run test:setup
      - run: apps/ml-service/.venv/bin/python -m uvicorn main:app --host 127.0.0.1 --port 8000 --app-dir apps/ml-service > /tmp/necklink-ml.log 2>&1 &
      - run: npm run test:unit && npm run test:ml && npm run test:api && npm run build:web
      - run: npm run migrate && ALLOW_DEMO_RESET=true npm run seed && npm run seed:operations
      - run: npm --prefix apps/api start > /tmp/necklink-api.log 2>&1 &
      - run: npx --prefix apps/web playwright install --with-deps chromium
      - run: npm --prefix apps/web run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: artifacts/
