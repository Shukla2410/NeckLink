services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: necklink_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: necklink
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-55432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/schema:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d necklink"]
      interval: 5s
      timeout: 5s
      retries: 10
  ml:
    build: ./apps/ml-service
    ports:
      - "127.0.0.1:8000:8000"
  app:
    build: .
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/necklink
      ML_SERVICE_URL: http://ml:8000
      HOST: 0.0.0.0
      PORT: 5000
      APP_MODE: ${APP_MODE:-demo}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      TRUST_PROXY: ${TRUST_PROXY:-false}
      DISABLE_EXTERNAL_DELIVERY: ${DISABLE_EXTERNAL_DELIVERY:-true}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      FIREBASE_DATABASE_URL: ${FIREBASE_DATABASE_URL:-}
      FIREBASE_DATABASE_SECRET: ${FIREBASE_DATABASE_SECRET:-}
      DISPATCHER_PASSWORD: ${DISPATCHER_PASSWORD:-}
      DRIVER_PASSWORD: ${DRIVER_PASSWORD:-}
      FIELD_PASSWORD: ${FIELD_PASSWORD:-}
      BHASHINI_USER_ID: ${BHASHINI_USER_ID:-}
      BHASHINI_API_KEY: ${BHASHINI_API_KEY:-}
      BHASHINI_PIPELINE_ID: ${BHASHINI_PIPELINE_ID:-}
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM_NUMBER: ${TWILIO_FROM_NUMBER:-}
      ENABLE_SMS_DELIVERY: ${ENABLE_SMS_DELIVERY:-false}
      ENABLE_WEATHER_INGESTION: ${ENABLE_WEATHER_INGESTION:-false}
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:5000}
    ports:
      - "127.0.0.1:5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      ml:
        condition: service_started
    command: ["sh", "-c", "node src/migrate.js && node src/server.js"]

volumes:
  pgdata:
